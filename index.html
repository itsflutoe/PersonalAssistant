<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Systems</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #00f2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 850px;
            background: rgba(16, 24, 48, 0.85);
            border: 1px solid #00f2ff33;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 0 35px rgba(0, 242, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00f2ff33;
            padding-bottom: 14px;
        }

        .title {
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid #00f2ff;
            color: #00f2ff;
            transition: all 0.3s ease;
        }

        .panels-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 650px) {
            .panels-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(5, 10, 20, 0.6);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 200px;
        }

        .panel-title {
            font-size: 0.8rem;
            color: #8ab4f8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .output-box {
            font-size: 0.95rem;
            color: #ffffff;
            line-height: 1.5;
            word-break: break-word;
            flex-grow: 1;
            overflow-y: auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            padding-top: 10px;
        }

        .mic-button {
            background: rgba(0, 242, 255, 0.1);
            border: 2px solid #00f2ff;
            color: #00f2ff;
            padding: 16px 36px;
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            transition: all 0.2s ease;
            outline: none;
        }

        .mic-button:hover {
            background: rgba(0, 242, 255, 0.25);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.4);
            transform: translateY(-2px);
        }

        .mic-button.active {
            background: #ff0055;
            border-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 0, 85, 0.9); }
            100% { box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div class="title">J.A.R.V.I.S. Core</div>
        <div id="statusBadge" class="status-badge">READY</div>
    </div>

    <div class="panels-container">
        <!-- Speech Input Box -->
        <div class="panel">
            <div class="panel-title">Your Voice Input</div>
            <div id="userInputBox" class="output-box">Press the button below to talk...</div>
        </div>

        <!-- J.A.R.V.I.S. Response Box -->
        <div class="panel">
            <div class="panel-title">J.A.R.V.I.S. Response</div>
            <div id="jarvisOutputBox" class="output-box">Standing by, sir.</div>
        </div>
    </div>

    <div class="controls">
        <button id="micBtn" class="mic-button">🎤 Speak to J.A.R.V.I.S.</button>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const GROQ_API_KEY = "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"; 
    const MODEL_NAME = "qwen/qwen3.8-27b";
    
    const systemPrompt = {
        "role": "system", 
        "content": "You are J.A.R.V.I.S., Tony Stark's witty, polite, and highly intelligent AI assistant. Keep responses brief, crisp, and conversational. Do not use markdown syntax, asterisks, bullet points, or special formatting symbols in your text."
    };
    
    let conversationHistory = [systemPrompt];
    let isListening = false;
    let isSpeaking = false;

    const statusBadge = document.getElementById("statusBadge");
    const userInputBox = document.getElementById("userInputBox");
    const jarvisOutputBox = document.getElementById("jarvisOutputBox");
    const micBtn = document.getElementById("micBtn");

    function updateStatus(text, color = "#00f2ff") {
        statusBadge.innerText = text;
        statusBadge.style.borderColor = color;
        statusBadge.style.color = color;
    }

    // Initialize Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        alert("Speech Recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
    }

    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    micBtn.addEventListener("click", () => {
        if (isSpeaking) {
            window.speechSynthesis.cancel();
            isSpeaking = false;
        }

        if (!isListening) {
            try {
                recognition.start();
            } catch (e) {
                console.warn("Recognition start issue:", e);
            }
        } else {
            recognition.stop();
        }
    });

    recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("active");
        micBtn.innerText = "🛑 Stop Listening";
        updateStatus("LISTENING...", "#ff0055");
        userInputBox.innerText = "Listening to your voice...";
        userInputBox.style.color = "#ffbb00";
    };

    recognition.onresult = async (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
            } else {
                interimTranscript += event.results[i][0].transcript;
            }
        }

        if (interimTranscript.trim().length > 0) {
            userInputBox.innerText = interimTranscript;
        }

        if (finalTranscript.trim().length > 0) {
            const speechResult = finalTranscript.trim();
            userInputBox.innerText = `"${speechResult}"`;
            userInputBox.style.color = "#ffffff";
            
            updateStatus("PROCESSING...", "#ffbb00");

            conversationHistory.push({ role: "user", content: speechResult });

            const rawReply = await queryGroqAPI(conversationHistory);
            
            // Clean markdown symbols for the voice engine
            const spokenReply = cleanTextForSpeech(rawReply);

            // Display raw or slightly cleaned reply in the box
            jarvisOutputBox.innerText = rawReply;

            conversationHistory.push({ role: "assistant", content: rawReply });
            speakText(spokenReply);
        }
    };

    recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("active");
        micBtn.innerText = "🎤 Speak to J.A.R.V.I.S.";
        if (!isSpeaking) {
            updateStatus("READY", "#00f2ff");
        }
    };

    recognition.onerror = (event) => {
        isListening = false;
        micBtn.classList.remove("active");
        micBtn.innerText = "🎤 Speak to J.A.R.V.I.S.";
        
        if (event.error !== 'no-speech' && event.error !== 'aborted') {
            userInputBox.innerText = "Microphone error: " + event.error;
        }
        updateStatus("READY", "#00f2ff");
    };

    async function queryGroqAPI(history) {
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: history,
                    temperature: 0.7,
                    max_completion_tokens: 200
                })
            });

            const data = await response.json();
            
            if (data.error) {
                return `API Error: ${data.error.message || 'Check your API Key.'}`;
            }

            return data.choices[0].message.content;
        } catch (error) {
            return "Unable to connect to Groq servers. Please verify your internet connection or API key.";
        }
    }

    // Strips markdown characters (*, #, _, etc.) so TTS doesn't read them aloud
    function cleanTextForSpeech(text) {
        return text
            .replace(/[*_#`~]/g, '') // Removes markdown symbols
            .replace(/\[.*?\]/g, '') // Removes bracketed text cues like [smiles]
            .trim();
    }

    // J.A.R.V.I.S. Voice Engine Configuration
    function speakText(text) {
        if (!('speechSynthesis' in window)) {
            updateStatus("READY", "#00f2ff");
            return;
        }

        isSpeaking = true; 
        updateStatus("SPEAKING...", "#00ff88");
        window.speechSynthesis.cancel(); 

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.02; // Crisp, sharp cadence
        utterance.pitch = 0.88; // Slightly deeper, more formal register

        // Attempt to find a British English voice for that classic J.A.R.V.I.S. accent
        const voices = window.speechSynthesis.getVoices();
        const britishVoice = voices.find(v => v.lang === 'en-GB' || v.name.includes('UK English') || v.name.includes('British'));
        const fallbackVoice = voices.find(v => v.lang.includes('en-US'));

        if (britishVoice) {
            utterance.voice = britishVoice;
        } else if (fallbackVoice) {
            utterance.voice = fallbackVoice;
        }

        utterance.onend = () => {
            isSpeaking = false;
            updateStatus("READY", "#00f2ff");
        };

        utterance.onerror = () => {
            isSpeaking = false;
            updateStatus("READY", "#00f2ff");
        };

        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
