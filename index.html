<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. Core</title>
</head>
<body>

<script>
    // Configuration
    const GROQ_API_KEY = "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"; 
    
    // System instructions to shape the persona
    const systemPrompt = {
        "role": "system", 
        "content": "You are J.A.R.V.I.S., Tony Stark's witty, polite, and concise AI assistant. Keep responses short and conversational, as they will be spoken out loud."
    };
    
    let conversationHistory = [systemPrompt];
    let isSpeaking = false; 

    // Initialize Browser Speech Recognition (STT)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        alert("Speech Recognition API is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
    }

    const recognition = new SpeechRecognition();
    recognition.continuous = true;      
    recognition.interimResults = false; 
    recognition.lang = 'en-US';

    // When speech is recognized
    recognition.onresult = async (event) => {
        if (isSpeaking) return; 

        const speechResult = event.results[event.results.length - 1][0].transcript.trim();
        console.log("User said:", speechResult);

        conversationHistory.push({ role: "user", content: speechResult });
        recognition.stop();

        const jarvisReply = await queryGroqAPI(conversationHistory);
        console.log("J.A.R.V.I.S.:", jarvisReply);

        conversationHistory.push({ role: "assistant", content: jarvisReply });
        speakText(jarvisReply);
    };

    recognition.onend = () => {
        if (!isSpeaking) {
            restartListening();
        }
    };

    // --- FIXED ERROR HANDLER ---
    recognition.onerror = (event) => {
        console.warn("Speech recognition error:", event.error);
        
        // Auto-recover cleanly if the user is just staying quiet
        if (event.error === 'no-speech' || event.error === 'aborted') {
            restartListening();
        }
    };

    async function queryGroqAPI(history) {
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: history,
                    temperature: 0.7,
                    max_tokens: 150
                })
            });

            const data = await response.json();
            return data.choices[0].message.content;
        } catch (error) {
            console.error("Groq API Error:", error);
            return "Systems are experiencing a minor glitch, sir.";
        }
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) {
            restartListening();
            return;
        }

        isSpeaking = true; 
        window.speechSynthesis.cancel(); 

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0; 
        utterance.pitch = 0.9; 

        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => v.lang.includes('en-US') || v.lang.includes('en-GB'));
        if (preferredVoice) {
            utterance.voice = preferredVoice;
        }

        utterance.onend = () => {
            isSpeaking = false;
            restartListening();
        };

        utterance.onerror = () => {
            isSpeaking = false;
            restartListening();
        };

        window.speechSynthesis.speak(utterance);
    }

    function restartListening() {
        setTimeout(() => {
            try {
                recognition.start();
            } catch (e) {
                // Safeguard against overlapping states
            }
        }, 300);
    }

    window.addEventListener('click', () => {
        try {
            recognition.start();
            console.log("J.A.R.V.I.S. listening systems active.");
        } catch (e) {
            // Already running
        }
    }, { once: true });

</script>

</body>
</html>
